name: Portal CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/portal-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container-smoke:
    name: Run production Compose smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    env:
      PORTAL_IMAGE_REGISTRY: semaphore-portal-ci
      PORTAL_IMAGE_TAG: ci
      PORTAL_PULL_POLICY: missing
      POSTGRES_DB: portal_ci
      POSTGRES_USER: portal_ci
      POSTGRES_PASSWORD: ci_database_password_2026
      PORTAL_SECRET_KEY: ci_secret_key_longer_than_thirty_two_characters_2026
      PORTAL_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PORTAL_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      PORTAL_BOOTSTRAP_ADMIN_PASSWORD: ci_admin_password_2026
      PORTAL_BOOTSTRAP_ADMIN_NAME: CI Administrator
      PORTAL_COOKIE_SECURE: "false"
      PORTAL_ALLOWED_HOSTS: localhost,127.0.0.1
      PORTAL_SESSION_HOURS: "12"
      SEMAPHORE_REQUEST_TIMEOUT_SECONDS: "30"
      PORTAL_BIND_ADDRESS: 127.0.0.1
      PORTAL_PUBLIC_PORT: "18080"
      PORTAL_DOMAIN: http://localhost
      PORTAL_GATEWAY_BIND_ADDRESS: 127.0.0.1
      PORTAL_HTTP_PORT: "18081"
      PORTAL_HTTPS_PORT: "18443"
      PORTAL_LOG_MAX_SIZE: 1m
      PORTAL_LOG_MAX_FILES: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Build application images locally
        run: |
          docker build --tag semaphore-portal-ci-backend:ci ./backend
          docker build --tag semaphore-portal-ci-frontend:ci ./frontend

      - name: Start production Compose stack
        run: docker compose --profile tls up --detach --wait

      - name: Verify gateway health and login
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            --resolve localhost:18081:127.0.0.1 \
            http://localhost:18081/api/health
          curl --fail --silent --show-error \
            --resolve localhost:18081:127.0.0.1 \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:18081' \
            --data '{"email":"admin@example.com","password":"ci_admin_password_2026"}' \
            http://localhost:18081/api/auth/login

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile tls logs --no-color

      - name: Stop production Compose stack
        if: always()
        run: docker compose --profile tls down --volumes --remove-orphans

  images:
    name: Build ${{ matrix.component }} image
    needs:
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: >-
            ${{ github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true
          provenance: mode=max
