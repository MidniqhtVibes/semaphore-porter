map $http_x_forwarded_proto $portal_forwarded_proto {
  default $scheme;
  ~*^http$ http;
  ~*^https$ https;
}

map $portal_forwarded_proto $portal_hsts {
  default "";
  https "max-age=31536000; includeSubDomains";
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security $portal_hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/portal/runs/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    # Externen Port erhalten; der Login vergleicht Origin und Host exakt.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1900s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_read_timeout 120s;
    client_max_body_size 10m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|ico|woff2)$ {
    expires 1y;
    try_files $uri =404;
  }
}
